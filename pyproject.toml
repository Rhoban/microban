[project]
name = "microban"
version = "0.0.2"
description = "Microban project"
readme = "README.md"
requires-python = ">=3.12,<3.13"   # 3.12: onnxruntime, placo and the BMI088 library all have aarch64 wheels for it
dependencies = [
    "numpy",
    "onnxruntime>=1.26.0",
    "placo>=0.9.23",
    "pollen_bmi088_imu_library==1.0.0rc1",
    "rustypot>=1.4.2",
]

[dependency-groups]
dashboard = [            # the live dashboard on the PC (make dashboard): src/humanoid_dashboard
    "mujoco>=3.2",
    "aiohttp>=3.9",
]
sim = [
    "better-actuator-models @ git+https://github.com/Rhoban/bam.git@0007411bd82c48f1bc12ae8382f98e4d8b879c95",   # vin_drop_gain (sim/mujoco_controller.py)
    "mujoco>=3.8.1",
]

[tool.uv]
override-dependencies = [
    "numpy>=2.3",
]
