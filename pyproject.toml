[project]
name = "microban"
version = "0.0.2"
description = "Microban project"
readme = "README.md"
requires-python = ">=3.12,<3.13"   # 3.12: onnxruntime, placo and the BMI088 library all have aarch64 wheels for it
dependencies = [
    "numpy",
    "onnxruntime>=1.26.0",
    "placo>=0.9.23",
    "pollen_bmi088_imu_library==1.0.0rc1",
    "rustypot>=1.13.1",            # fast sync read (robot_controller.py); the motor tools pin the same
    "microban-model",      # the robot's MJCF / URDF (Rhoban/microban_model; meshes in Git LFS)
]

[dependency-groups]
dashboard = [            # the live dashboard on the PC (make dashboard): src/humanoid_dashboard
    "mujoco>=3.2",
    "aiohttp>=3.9",
    "zeroconf>=0.130",      # make discover-robots: the robots announced on the network (mDNS)
]
sim = [                  # make sim: Rhoban's robot simulator (the robot, its servos simulated by BAM, its sensors)
    "microban-sim",
]

[tool.uv]
override-dependencies = [
    "numpy>=2.3",
]

[tool.uv.sources]
microban-model = { git = "https://github.com/Rhoban/microban_model", lfs = true }
microban-sim = { git = "https://github.com/Rhoban/microban_sim" }
