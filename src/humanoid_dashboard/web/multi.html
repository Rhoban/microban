<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four robots</title>
<style>
  :root { --bg: #f3f3f0; --panel: #fff; --ink: #1d2126; --muted: #6b7078; --line: #e1e1db; --accent: #d9622b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171a; --panel: #1d2024; --ink: #e8e9eb; --muted: #9aa0a8; --line: #30343a; --accent: #f07a3e; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 14px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 15px; margin: 0; }
  label.opt { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; cursor: pointer; }
  label.opt input { accent-color: var(--accent); margin: 0; }
  #grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; padding: 6px; }
  #pickers { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; }
  #pickers label { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
  select { font: inherit; font-weight: 600; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 2px 6px; max-width: 230px; }
  a.btn { color: var(--ink); text-decoration: none; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); white-space: nowrap; }
  a.btn:hover { border-color: var(--accent); }
  iframe { width: 100%; height: 100%; min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  @media (max-width: 900px) { #grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, 85vh); } body { height: auto; } }
</style>
</head>
<body>
<header>
  <h1>Four robots</h1>
  <span id="pickers"></span>
  <label class="opt" title="the motors' temperature and hardware errors, read by each robot once a second: off, the robots no longer read them"><input type="checkbox" id="health" checked> motor health</label>
  <a class="btn" href="/" title="back to one robot (the first pane's)">▣ 1 robot</a>
</header>
<div id="grid"></div>
<script>
// four panes, each the dashboard page of one of the server's robots (?h=0..3), chosen in the top bar among the
// saved robots (the server's list, saved from any dashboard page; each pane shows its robot's name over its 3D view);
// the motor-health option set here for all four
const N = 4, grid = document.getElementById("grid"), pickers = document.getElementById("pickers"), health = document.getElementById("health");
const socks = [], sels = [];
for (let h = 0; h < N; h++) {
  const lab = document.createElement("label"); lab.textContent = `${h + 1}`;
  const sel = document.createElement("select"); sel.innerHTML = `<option value="">—</option>`;
  lab.appendChild(sel); pickers.appendChild(lab); sels.push(sel);
  const f = document.createElement("iframe"); f.src = `/?h=${h}&compact=1`; f.title = `robot ${h + 1}`; grid.appendChild(f);
  sel.onchange = () => { if (sel.value) send(h, { type: "connect", host: sel.value }); };
  open(h);
}
health.onchange = () => { for (let h = 0; h < N; h++) send(h, { type: "health", on: health.checked }); };
function send(h, m) { const ws = socks[h]; if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
function open(h) {
  const ws = new WebSocket(`ws://${location.host}/ws?h=${h}`); socks[h] = ws;
  ws.onopen = () => { if (!health.checked) send(h, { type: "health", on: false }); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type !== "robot") return;
    const sel = sels[h], saved = Object.entries(m.saved || {}).sort();
    const opts = [`<option value="">—</option>`].concat(saved.map(([name, r]) =>
      `<option value="${esc(r.host)}">${esc(name)} · ${esc(r.host)}</option>`));
    if (m.host && !saved.some(([, r]) => r.host === m.host)) opts.push(`<option value="${esc(m.host)}">${esc(m.host)}</option>`);
    if (sel.innerHTML !== opts.join("")) sel.innerHTML = opts.join("");
    sel.value = m.host || "";
    if (h === 0 && m.health === false && health.checked) health.checked = false;
  };
  ws.onclose = () => setTimeout(() => open(h), 1500);
}
</script>
</body>
</html>
